version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - what's up
      - hello there
      - good morning
      - good evening
      - moin
      - hey there
      - let's go
      - hey dude
      - aw are you
      - goodmorning
      - goodevening
      - good afternoon

  - intent: goodbye
    examples: |
      - cu
      - good by
      - cee you later
      - good night
      - bye
      - goodbye
      - have a nice day
      - see you around
      - bye bye
      - see you later

    ## Financial Information
  - intent: ask_financial_info
    examples: |
      - What is a credit score?
      - How do I create a budget?
      - What’s the best way to start saving money?
      - Explain compound interest
      - How does a savings account work?

  - intent: nlu_fallback
    examples: |
      - [any query Rasa might not predict]

  - intent: affirm
    examples: |
      - yes
      - y
      - indeed
      - of course
      - that sounds good
      - correct

  - intent: deny
    examples: |
      - no
      - n
      - never
      - I don't think so
      - don't like that
      - no way
      - not really


